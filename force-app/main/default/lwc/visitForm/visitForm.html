<template>
    <lightning-card title="Customer Visit Form" icon-name="standard:customer">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <template if:true={error}>
                <div class="slds-notify slds-notify__body slds-theme_error slds-m-bottom_small">
                    <span>{error}</span>
                </div>
            </template>

            <lightning-input
                label="Store"
                value={storeName}
                disabled
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-input
                label="Customer"
                value={customerName}
                disabled
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-input
                type="datetime"
                label="Check In"
                value={checkIn}
                onchange={handleCheckInChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-input
                type="datetime"
                label="Check Out"
                value={checkOut}
                onchange={handleCheckOutChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-input
                type="number"
                label="Duration (minutes)"
                value={duration}
                onchange={handleDurationChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-input
                type="checkbox"
                label="Purchase Made"
                checked={purchaseMade}
                onchange={handlePurchaseMadeChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-select
                label="Visit Status"
                value={visitStatus}
                options={visitStatusOptions}
                onchange={handleVisitStatusChange}
                class="slds-m-bottom_small">
            </lightning-select>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Save Visit"
                    onclick={handleSave}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    variant="neutral"
                    label="Reset"
                    onclick={handleReset}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
