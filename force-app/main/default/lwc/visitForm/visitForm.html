<template>
    <lightning-card title="Customer Visit Form" icon-name="standard:customer">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <template if:true={error}>
                <div class="slds-notify slds-notify__body slds-theme_error slds-m-bottom_small">
                    <span>{error}</span>
                </div>
            </template>

            <lightning-input
                label="Store"
                value={storeName}
                onchange={handleStoreChange}
                class="slds-m-bottom_small"
                data-field="store">
            </lightning-input>

            <div class="slds-combobox_container slds-m-bottom_small" if:true={showStoreOptions}>
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                    <div class="slds-form-element">
                        <div class="slds-input-has-icon">
                            <lightning-input
                                label="Search Store"
                                value={storeSearchTerm}
                                onchange={handleStoreSearch}
                                placeholder="Type to search stores...">
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-dropdown slds-dropdown--visible">
                        <ul class="slds-dropdown__list slds-autocombobox__listbox" role="listbox">
                            <template for:each={storeOptions} for:item="store">
                                <li role="option" key={store.Id}>
                                    <a class="slds-dropdown__item_action slds-text-link" onclick={handleStoreSelect} data-id={store.Id} data-name={store.Name}>
                                        {store.Name}
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>

            <lightning-input
                label="Customer"
                value={customerName}
                onchange={handleCustomerChange}
                class="slds-m-bottom_small"
                data-field="customer">
            </lightning-input>

            <div class="slds-combobox_container slds-m-bottom_small" if:true={showCustomerOptions}>
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                    <div class="slds-form-element">
                        <div class="slds-input-has-icon">
                            <lightning-input
                                label="Search Customer"
                                value={customerSearchTerm}
                                onchange={handleCustomerSearch}
                                placeholder="Type to search customers...">
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-dropdown slds-dropdown--visible">
                        <ul class="slds-dropdown__list slds-autocombobox__listbox" role="listbox">
                            <template for:each={customerOptions} for:item="cust">
                                <li role="option" key={cust.Id}>
                                    <a class="slds-dropdown__item_action slds-text-link" onclick={handleCustomerSelect} data-id={cust.Id} data-name={cust.Name}>
                                        {cust.Name}
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>

            <lightning-input
                type="datetime"
                label="Check In"
                value={checkIn}
                onchange={handleCheckInChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-input
                type="datetime"
                label="Check Out"
                value={checkOut}
                onchange={handleCheckOutChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-input
                type="number"
                label="Duration (minutes)"
                value={duration}
                onchange={handleDurationChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-input
                type="checkbox"
                label="Purchase Made"
                checked={purchaseMade}
                onchange={handlePurchaseMadeChange}
                class="slds-m-bottom_small">
            </lightning-input>

            <lightning-select
                label="Visit Status"
                value={visitStatus}
                options={visitStatusOptions}
                onchange={handleVisitStatusChange}
                class="slds-m-bottom_small">
            </lightning-select>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Save Visit"
                    onclick={handleSave}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    variant="neutral"
                    label="Reset"
                    onclick={handleReset}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
