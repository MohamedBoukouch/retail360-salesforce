<template>

    <lightning-card
        title="Customer 360"
        icon-name="standard:contact">

        <template if:true={isLoading}>

            <lightning-spinner
                alternative-text="Loading customer data">
            </lightning-spinner>

        </template>


        <template if:true={hasError}>

            <div class="slds-p-around_medium">

                <div class="slds-notify slds-notify_alert slds-alert_error">

                    <span>
                        Unable to load customer data.
                    </span>

                </div>

            </div>

        </template>


        <template if:true={customer}>

            <!-- CUSTOMER OVERVIEW -->

            <div class="slds-p-around_medium">

                <div class="customer-header">

                    <div>

                        <div class="customer-name">
                            {customerName}
                        </div>

                        <div class="customer-account">
                            {accountName}
                        </div>

                    </div>

                </div>


                <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                        <div class="info-card">

                            <span class="label">
                                Email
                            </span>

                            <span class="value">
                                {customerEmail}
                            </span>

                        </div>

                    </div>


                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                        <div class="info-card">

                            <span class="label">
                                Phone
                            </span>

                            <span class="value">
                                {customerPhone}
                            </span>

                        </div>

                    </div>


                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                        <div class="info-card">

                            <span class="label">
                                Account
                            </span>

                            <span class="value">
                                {accountName}
                            </span>

                        </div>

                    </div>

                </div>

            </div>


            <!-- KPI -->

            <div class="slds-p-horizontal_medium">

                <div class="slds-grid slds-wrap slds-gutters">

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                        <div class="metric-card">

                            <div class="metric-value">
                                {totalVisits}
                            </div>

                            <div class="metric-label">
                                Total Visits
                            </div>

                        </div>

                    </div>


                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                        <div class="metric-card">

                            <div class="metric-value">
                                {purchases}
                            </div>

                            <div class="metric-label">
                                Purchases
                            </div>

                        </div>

                    </div>


                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">

                        <div class="metric-card">

                            <div class="metric-value">
                                {formattedOpportunityAmount}
                            </div>

                            <div class="metric-label">
                                Opportunity Value
                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- VISITS -->

            <div class="section">

                <div class="section-title">
                    Customer Visits
                </div>

                <template if:true={hasVisits}>

                    <div class="table-container">

                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">

                            <thead>

                                <tr>

                                    <th>Visit</th>
                                    <th>Store</th>
                                    <th>Sales Rep</th>
                                    <th>Check In</th>
                                    <th>Duration</th>
                                    <th>Purchase</th>

                                </tr>

                            </thead>

                            <tbody>

                                <template
                                    for:each={visits}
                                    for:item="visit">

                                    <tr key={visit.Id}>

                                        <td>
                                            {visit.Name}
                                        </td>

                                        <td>
                                            {visit.Store__r.Name}
                                        </td>

                                        <td>
                                            {visit.Sales_Rep__r.Name}
                                        </td>

                                        <td>
                                            {visit.Check_In__c}
                                        </td>

                                        <td>
                                            {visit.Duration__c}
                                        </td>

                                        <td>

                                            <template if:true={visit.Purchase_Made__c}>
                                                Yes
                                            </template>

                                            <template if:false={visit.Purchase_Made__c}>
                                                No
                                            </template>

                                        </td>

                                    </tr>

                                </template>

                            </tbody>

                        </table>

                    </div>

                </template>


                <template if:false={hasVisits}>

                    <p class="empty-message">
                        No visits found.
                    </p>

                </template>

            </div>


            <!-- OPPORTUNITIES -->

            <div class="section">

                <div class="section-title">
                    Opportunities
                </div>

                <template if:true={hasOpportunities}>

                    <div class="table-container">

                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">

                            <thead>

                                <tr>

                                    <th>Name</th>
                                    <th>Stage</th>
                                    <th>Amount</th>
                                    <th>Close Date</th>

                                </tr>

                            </thead>

                            <tbody>

                                <template
                                    for:each={opportunities}
                                    for:item="opportunity">

                                    <tr key={opportunity.Id}>

                                        <td>
                                            {opportunity.Name}
                                        </td>

                                        <td>
                                            {opportunity.StageName}
                                        </td>

                                        <td>
                                            {opportunity.Amount}
                                        </td>

                                        <td>
                                            {opportunity.CloseDate}
                                        </td>

                                    </tr>

                                </template>

                            </tbody>

                        </table>

                    </div>

                </template>


                <template if:false={hasOpportunities}>

                    <p class="empty-message">
                        No opportunities found.
                    </p>

                </template>

            </div>


            <!-- RECOMMENDATIONS -->

            <div class="section">

                <div class="section-title">
                    Recommendations
                </div>

                <template if:true={hasRecommendations}>

                    <div class="recommendation-list">

                        <template
                            for:each={recommendations}
                            for:item="recommendation">

                            <div
                                class="recommendation-card"
                                key={recommendation.Id}>

                                <div class="recommendation-header">

                                    <strong>
                                        {recommendation.Product__r.Name}
                                    </strong>

                                    <span>
                                        {recommendation.Status__c}
                                    </span>

                                </div>

                                <div class="confidence">

                                    Confidence:
                                    {recommendation.Confidence__c}%

                                </div>

                                <div class="reason">

                                    {recommendation.Reason__c}

                                </div>

                            </div>

                        </template>

                    </div>

                </template>


                <template if:false={hasRecommendations}>

                    <p class="empty-message">
                        No recommendations found.
                    </p>

                </template>

            </div>


            <!-- CASES -->

            <div class="section">

                <div class="section-title">
                    Cases
                </div>

                <template if:true={hasCases}>

                    <div class="table-container">

                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">

                            <thead>

                                <tr>

                                    <th>Case</th>
                                    <th>Subject</th>
                                    <th>Status</th>
                                    <th>Priority</th>

                                </tr>

                            </thead>

                            <tbody>

                                <template
                                    for:each={cases}
                                    for:item="caseRecord">

                                    <tr key={caseRecord.Id}>

                                        <td>
                                            {caseRecord.CaseNumber}
                                        </td>

                                        <td>
                                            {caseRecord.Subject}
                                        </td>

                                        <td>
                                            {caseRecord.Status}
                                        </td>

                                        <td>
                                            {caseRecord.Priority}
                                        </td>

                                    </tr>

                                </template>

                            </tbody>

                        </table>

                    </div>

                </template>


                <template if:false={hasCases}>

                    <p class="empty-message">
                        No cases found.
                    </p>

                </template>

            </div>

        </template>

    </lightning-card>

</template>
